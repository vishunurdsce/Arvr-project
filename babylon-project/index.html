<!DOCTYPE html>
<html>
<head>
    <title>Advanced Angioplasty Surgery Simulator</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; overflow: hidden; }
        #ui {
            position: absolute; top: 20px; left: 20px; background: rgba(255, 255, 255, 0.9);
            padding: 20px; width: 300px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        .stats { margin-top: 15px; padding: 10px; background: #eee; border-radius: 5px; }
        button {
            width: 100%; margin: 4px 0; padding: 10px; cursor: pointer;
            border: none; border-radius: 5px; background: #2c3e50; color: white;
            transition: 0.3s; font-weight: bold;
        }
        button:hover { background: #34495e; transform: translateX(5px); }
        #info { margin-top: 15px; font-size: 13px; line-height: 1.4; color: #333; }
        .gauge-container { height: 10px; width: 100%; background: #ccc; border-radius: 5px; margin-top: 5px; }
        #flowGauge { height: 100%; width: 100%; background: #27ae60; border-radius: 5px; transition: 0.5s; }
    </style>
</head>
<body>

<div id="ui">
    <h2 style="margin:0 0 10px 0; color: #c0392b;">CardioSim v2.0</h2>
    <div id="step-buttons">
        <button onclick="setStep(1)">1. Baseline Physiology</button>
        <button onclick="setStep(2)">2. Plaque Accumulation</button>
        <button onclick="setStep(3)">3. Critical Stenosis</button>
        <button onclick="setStep(4)">4. Balloon Angioplasty</button>
        <button onclick="setStep(5)">5. Stent Deployment</button>
        <button onclick="setStep(6)">6. Post-Op Recovery</button>
    </div>

    <div class="stats">
        <strong>Vessel Patency:</strong> <span id="patencyText">100%</span>
        <div class="gauge-container"><div id="flowGauge"></div></div>
        <p style="margin:5px 0 0 0; font-size: 12px;">Flow Rate: <span id="rateValue">5.0</span> L/min</p>
    </div>
    
    <div id="info">System ready. Select a stage to begin simulation.</div>
</div>

<canvas id="renderCanvas" style="width:100%; height:100vh;"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

let artery, plaque, stent, bloodParticles, heart;
let currentStep = 1;

const createScene = () => {
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3(0.05, 0.02, 0.02);

    // Camera & Light
    const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/2.2, 8, new BABYLON.Vector3(0,0,0), scene);
    camera.attachControl(canvas, true);
    const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 0.7;

    // Add a Glow Layer for medical "monitor" feel
    const glow = new BABYLON.GlowLayer("glow", scene);
    glow.intensity = 0.5;

    // 1. Create Organic Artery (Tube)
    const curvePoints = [];
    for(let i = -3; i <= 3; i+=0.5) curvePoints.push(new BABYLON.Vector3(i, Math.sin(i/2)*0.2, 0));
    
    artery = BABYLON.MeshBuilder.CreateTube("artery", {
        path: curvePoints, radius: 0.6, sideOrientation: BABYLON.Mesh.DOUBLESIDE
    }, scene);
    
    const arteryMat = new BABYLON.StandardMaterial("artMat", scene);
    arteryMat.diffuseColor = new BABYLON.Color3(0.8, 0.2, 0.2);
    arteryMat.alpha = 0.4; // Semi-transparent to see inside
    artery.material = arteryMat;

    // 2. Create Plaque (Irregular)
    plaque = BABYLON.MeshBuilder.CreateSphere("plaque", {diameterX: 1, diameterY: 0.5, diameterZ: 0.8}, scene);
    plaque.position.x = 0;
    const plaqueMat = new BABYLON.StandardMaterial("plqMat", scene);
    plaqueMat.diffuseColor = new BABYLON.Color3(0.9, 0.8, 0.4);
    plaque.material = plaqueMat;
    plaque.scaling = new BABYLON.Vector3(0.1, 0.1, 0.1);
    plaque.isVisible = false;

    // 3. Create Stent (Wireframe Cylinder)
    stent = BABYLON.MeshBuilder.CreateCylinder("stent", {height: 1.5, diameter: 0.55}, scene);
    stent.rotation.z = Math.PI/2;
    const stentMat = new BABYLON.StandardMaterial("stentMat", scene);
    stentMat.diffuseColor = new BABYLON.Color3(0.7, 0.7, 0.8);
    stentMat.wireframe = true;
    stent.material = stentMat;
    stent.isVisible = false;

    // 4. Blood Particle System
    bloodParticles = new BABYLON.ParticleSystem("blood", 2000, scene);
    bloodParticles.particleTexture = new BABYLON.Texture("https://www.babylonjs-builtins.com/textures/flare.png", scene);
    bloodParticles.emitter = new BABYLON.Vector3(-3, 0, 0);
    bloodParticles.minEmitBox = new BABYLON.Vector3(0, -0.3, -0.3);
    bloodParticles.maxEmitBox = new BABYLON.Vector3(0, 0.3, 0.3);
    bloodParticles.color1 = new BABYLON.Color4(1, 0, 0, 1);
    bloodParticles.minSize = 0.05;
    bloodParticles.maxSize = 0.1;
    bloodParticles.minLifeTime = 1.0;
    bloodParticles.maxLifeTime = 1.5;
    bloodParticles.emitRate = 500;
    bloodParticles.gravity = new BABYLON.Vector3(0, 0, 0);
    bloodParticles.direction1 = new BABYLON.Vector3(1, 0, 0);
    bloodParticles.minEmitPower = 4;
    bloodParticles.maxEmitPower = 5;
    bloodParticles.start();

    // 5. Load Heart Model
    loadHeartModel(scene);

    return scene;
};

function loadHeartModel(scene) {
    if (heart) {
        heart.dispose();
    }
    const modelFile = currentStep === 3 ? "realistic_human_heart.glb" : "beating-heart.glb";
    BABYLON.SceneLoader.ImportMesh("", "./models/", modelFile, scene, function (meshes) {
        heart = meshes[0];
        heart.scaling = new BABYLON.Vector3(0.05, 0.05, 0.05);
        heart.position = new BABYLON.Vector3(0, 0, 0);
    });
}

const scene = createScene();

function setStep(s) {
    currentStep = s;
    const info = document.getElementById("info");
    const gauge = document.getElementById("flowGauge");
    const patency = document.getElementById("patencyText");
    const rate = document.getElementById("rateValue");

    // Reset visibility logic
    switch(s) {
        case 1: // Normal
            info.innerText = "Normal Artery: Blood flow is laminer and unobstructed.";
            animateProperty(plaque, "scaling", new BABYLON.Vector3(0.1, 0.1, 0.1));
            plaque.isVisible = false;
            stent.isVisible = false;
            updatePhysiology(100, 500, 5.0, "100%", "27ae60");
            break;
        case 2: // Formation
            info.innerText = "Plaque Accumulation: Cholesterol deposits narrowing the lumen.";
            plaque.isVisible = true;
            animateProperty(plaque, "scaling", new BABYLON.Vector3(0.8, 1, 1));
            updatePhysiology(60, 300, 3.2, "60%", "#f1c40f");
            break;
        case 3: // Severe
            info.innerText = "Critical Stenosis: Blood flow significantly restricted. High risk of ischemia.";
            animateProperty(plaque, "scaling", new BABYLON.Vector3(1.2, 1.5, 1.2));
            updatePhysiology(20, 80, 1.1, "15%", "#c0392b");
            break;
        case 4: // Balloon
            info.innerText = "Balloon Angioplasty: Mechanical expansion of the arterial wall.";
            animateProperty(plaque, "scaling", new BABYLON.Vector3(0.5, 0.5, 0.5));
            updatePhysiology(80, 400, 4.1, "80%", "#2980b9");
            break;
        case 5: // Stent
            info.innerText = "Stent Deployment: Permanent mesh scaffold placed to prevent elastic recoil.";
            stent.isVisible = true;
            stent.scaling = new BABYLON.Vector3(0.1, 1, 0.1);
            animateProperty(stent, "scaling", new BABYLON.Vector3(1.1, 1, 1.1));
            updatePhysiology(95, 480, 4.8, "95%", "#27ae60");
            break;
        case 6: // Recovery
            info.innerText = "Recovery: Vessel remains patent. Optimal hemodynamics restored.";
            plaque.isVisible = false;
            updatePhysiology(100, 500, 5.0, "100%", "#2ecc71");
            break;
    }
}

// Utility to handle animations
function animateProperty(target, property, value) {
    BABYLON.Animation.CreateAndStartAnimation("anim", target, property, 30, 60, target[property], value, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
}

// Utility to update UI
function updatePhysiology(gaugeWidth, particles, flowRate, patencyVal, color) {
    document.getElementById("flowGauge").style.width = gaugeWidth + "%";
    document.getElementById("flowGauge").style.backgroundColor = color;
    document.getElementById("patencyText").innerText = patencyVal;
    document.getElementById("rateValue").innerText = flowRate;
    bloodParticles.emitRate = particles;
}

engine.runRenderLoop(() => {
    scene.render();
});

window.addEventListener("resize", () => engine.resize());

// Init
setStep(1);
</script>
</body>
</html>
